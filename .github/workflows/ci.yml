name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: proofkey_test
          POSTGRES_PASSWORD: proofkey_test
          POSTGRES_USER: proofkey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proofkey_test -d proofkey_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://proofkey_test:proofkey_test@127.0.0.1:5432/proofkey_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Install browser fixtures
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test cross-browser product journeys
        run: npm run test:e2e --workspace @proofkey/web

      - name: Build all workspaces
        run: npm run build
        env:
          VITE_ETHEREUM_SEPOLIA_RPC_URL: https://sepolia.rpc.proofkey.invalid
          VITE_CREDITCOIN_RPC_URL: https://creditcoin.rpc.proofkey.invalid
          VITE_USAGE_PAYMENT_REGISTRY_ADDRESS: '0x0000000000000000000000000000000000000001'
          VITE_MACHINE_REGISTRY_ADDRESS: '0x0000000000000000000000000000000000000002'
          VITE_ACCESS_PASS_ADDRESS: '0x0000000000000000000000000000000000000004'
          VITE_PROOFKEY_ASC_ADDRESS: '0x0000000000000000000000000000000000000005'
          VITE_DEMO_MACHINE_ID: '0xc04beae61beb9471c4f24c8788a4624988d2948a5c3d3dd0b6ba1b7602875bcc'
          VITE_PROOF_WORKER_URL: https://relay.proofkey.invalid

      - name: Audit production configuration and bundle
        run: npm run check:production
        env:
          VITE_ETHEREUM_SEPOLIA_RPC_URL: https://sepolia.rpc.proofkey.invalid
          VITE_CREDITCOIN_RPC_URL: https://creditcoin.rpc.proofkey.invalid
          VITE_USAGE_PAYMENT_REGISTRY_ADDRESS: '0x0000000000000000000000000000000000000001'
          VITE_MACHINE_REGISTRY_ADDRESS: '0x0000000000000000000000000000000000000002'
          VITE_ACCESS_PASS_ADDRESS: '0x0000000000000000000000000000000000000004'
          VITE_PROOFKEY_ASC_ADDRESS: '0x0000000000000000000000000000000000000005'
          VITE_DEMO_MACHINE_ID: '0xc04beae61beb9471c4f24c8788a4624988d2948a5c3d3dd0b6ba1b7602875bcc'
          VITE_PROOF_WORKER_URL: https://relay.proofkey.invalid
