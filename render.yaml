services:
  - type: web
    name: proofkey-relay
    runtime: node
    repo: https://github.com/EcstaceeLOR/ProofKey
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build --workspace @proofkey/worker
    startCommand: node apps/worker/dist/server.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 24.8.0
      - key: WORKER_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'false'
      - key: ETHEREUM_SEPOLIA_RPC_URL
        sync: false
      - key: CREDITCOIN_TESTNET_RPC_URL
        value: https://rpc.cc3-testnet.creditcoin.network
      - key: CREDITCOIN_PROOF_BUILDER_URL
        value: https://prover.cc3-testnet.creditcoin.network
      - key: SOURCE_CHAIN_KEY
        value: '1'
      - key: SEPOLIA_USAGE_PAYMENT_REGISTRY_ADDRESS
        sync: false
      - key: PROOFKEY_ASC_ADDRESS
        sync: false
      - key: WORKER_PRIVATE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://proofkey.vercel.app
      - key: SOURCE_CONFIRMATION_TIMEOUT_MS
        value: '180000'
      - key: ATTESTATION_POLL_INTERVAL_MS
        value: '15000'
      - key: ATTESTATION_TIMEOUT_MS
        value: '1200000'
      - key: RELAY_RETRY_ATTEMPTS
        value: '3'
      - key: RELAY_RETRY_BASE_DELAY_MS
        value: '2000'
      - key: RELAY_QUEUE_POLL_MS
        value: '2000'
      - key: RELAY_LEASE_DURATION_MS
        value: '90000'
      - key: RELAY_LEASE_HEARTBEAT_MS
        value: '30000'
      - key: RELAYER_MINIMUM_CC3_WEI
        value: '10000000000000000'
      - key: RELAY_RATE_LIMIT_REQUESTS
        value: '10'
      - key: RELAY_RATE_LIMIT_WINDOW_MS
        value: '60000'
